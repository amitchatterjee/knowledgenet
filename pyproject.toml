[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "knowledgenet"
version = "1.0.1"
authors = [
  { name="Amit Chatterjee"},
]

dependencies = [
  "opentelemetry-api >= 1.39.1",
  "opentelemetry-sdk >= 1.39.1",
  "opentelemetry-exporter-otlp >= 1.39.1"
]

description = "Knowledgenet RETE engine"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
]
keywords = [
    "RETE",
    "rules engine",
    "knowledgebase",
    "inference engine",
    "expert systems",
    "rule.based system",
    "forward chaining",
    "backward chaining",
]
license = "Apache-2.0"
readme = "README.md"
[project.urls]
Homepage = "https://github.com/amitchatterjee/knowledgenet"
Issues = "https://github.com/amitchatterjee/knowledgenet"
Repository = "https://github.com/amitchatterjee/knowledgenet.git"
Documentation = "https://github.com/amitchatterjee/knowledgenet/tree/develop/docs"

[dependency-groups]
dev = ["pytest", "pytest-cov", "build", "debugpy", "twine", "sphinx", "sphinx-markdown-builder", "mypy", "maturin>=1.7,<2.0"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "knowledgenet._native"

[tool.uv]
# Lets local path-dependents (e.g. knowledgenet-examples/autoins) detect source
# changes on a plain `uv sync`, not just changes to this file. Overrides uv's
# default cache key, so pyproject.toml itself must stay listed explicitly.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.py" },
  { file = "rust/**/*.rs" },
  { file = "rust/Cargo.toml" },
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
# Enforced package-wide, not per-module. Flip to false anytime strict typing
# gets in the way -- it's a single line, no per-module bookkeeping required
# either direction.
disallow_untyped_defs = true

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -rPX -s

      - name: Run mypy
        run: uv run mypy src/knowledgenet
